<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>morseboy1 — mGBA web emulator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #14161a;
      color: #c8ccd4;
      font: 14px/1.5 ui-monospace, "Cascadia Code", Menlo, monospace;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.08em; }
    #frame {
      padding: 14px;
      border: 2px solid #2a2e36;
      border-radius: 12px;
      background: #0b0d10;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    canvas {
      width: min(70vw, 480px);
      height: auto;
      aspect-ratio: 3 / 2;
      image-rendering: pixelated;
      border-radius: 4px;
      display: block;
    }
    #status { color: #7d8592; min-height: 1.5em; }
    #status.err { color: #e06c5e; }
    .keys { color: #565e6b; font-size: 12px; text-align: center; }
    kbd {
      border: 1px solid #3a4048;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0 5px;
      font-size: 11px;
      color: #9aa2ad;
    }
    /* On-screen controls (phones / no keyboard) */
    .pad {
      --u: clamp(44px, 13vw, 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pad button {
      font: inherit;
      color: #9aa2ad;
      background: #1d2026;
      border: 2px solid #2a2e36;
      border-radius: 10px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .pad button:active,
    .pad button.pressed {
      color: #e8ebef;
      background: #262b33;
      border-color: #c9a227;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, var(--u));
      grid-template-rows: repeat(3, var(--u));
    }
    .dpad .up    { grid-area: 1 / 2; border-radius: 10px 10px 2px 2px; }
    .dpad .left  { grid-area: 2 / 1; border-radius: 10px 2px 2px 10px; }
    .dpad .right { grid-area: 2 / 3; border-radius: 2px 10px 10px 2px; }
    .dpad .down  { grid-area: 3 / 2; border-radius: 2px 2px 10px 10px; }
    .dpad .core  { grid-area: 2 / 2; background: #171a1f; border-radius: 6px; }
    .ab {
      display: grid;
      grid-template-columns: repeat(2, calc(var(--u) * 1.25));
      grid-template-rows: repeat(2, calc(var(--u) * 1.25));
      gap: 10px;
    }
    .ab .b { grid-area: 1 / 1; border-radius: 50%; font-weight: 700; }
    .ab .a { grid-area: 2 / 2; border-radius: 50%; font-weight: 700; }
    .pills {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pills button {
      font: 12px/1 ui-monospace, Menlo, monospace;
      color: #9aa2ad;
      background: #1d2026;
      border: 2px solid #2a2e36;
      border-radius: 999px;
      padding: 12px 18px;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .pills button:active,
    .pills button.pressed {
      color: #e8ebef;
      background: #262b33;
      border-color: #c9a227;
    }
  </style>
</head>
<body>
  <h1>MORSEBOY1</h1>
  <div id="frame"><canvas id="canvas" width="240" height="160"></canvas></div>
  <div id="status">loading emulator core…</div>

  <div class="pad" id="pad">
    <div class="dpad">
      <button type="button" class="up" data-btn="Up" aria-label="d-pad up">▲</button>
      <button type="button" class="left" data-btn="Left" aria-label="d-pad left">◀</button>
      <div class="core"></div>
      <button type="button" class="right" data-btn="Right" aria-label="d-pad right">▶</button>
      <button type="button" class="down" data-btn="Down" aria-label="d-pad down">▼</button>
    </div>
    <div class="ab">
      <button type="button" class="b" data-btn="B" aria-label="B button">B</button>
      <button type="button" class="a" data-btn="A" aria-label="A button">A</button>
    </div>
  </div>
  <div class="pills" id="pills">
    <button type="button" data-btn="Select">Select</button>
    <button type="button" data-btn="Start">Start</button>
    <button type="button" id="btn-pause" data-action="pause">Pause</button>
    <button type="button" id="btn-reset" data-action="reset">Reset</button>
  </div>

  <div class="keys">
    <kbd>Z</kbd>/<kbd>X</kbd> B/A · <kbd>Enter</kbd> Start · <kbd>Shift</kbd> Select ·
    arrows: d-pad · <kbd>P</kbd> pause · <kbd>R</kbd> reset — or tap the pad below
  </div>

  <script type="module">
    import mGBA from '/mgba.js';

    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const say = (msg, err = false) => {
      status.textContent = msg;
      status.classList.toggle('err', err);
    };

    try {
      const Module = await mGBA({ canvas });
      say('filesystem init…');
      await Module.FSInit();

      // mGBA persists an auto save state to IndexedDB every 30 s and
      // restores it on the next load (both on by default) — that's what
      // made every reload "resume" instead of restart. This ROM keeps no
      // saves of its own, so disable the feature and clear stale state.
      Module.setCoreSettings({ autoSaveStateEnable: false, restoreAutoSaveStateOnLoad: false });
      try { Module.FS.unlink('/autosave/morseboy1_auto.ss'); } catch { /* first run */ }

      const version = `${Module.version.projectName} ${Module.version.projectVersion}`;
      console.log('core:', version);

      // Put the ROM inside the emulator's virtual filesystem.
      say('fetching ROM…');
      const res = await fetch('/morseboy1.gb');
      if (!res.ok) throw new Error(`ROM fetch failed (${res.status}) — run "make" first`);
      const rom = new Uint8Array(await res.arrayBuffer());
      const romPath = '/data/games/morseboy1.gb';
      Module.FS.mkdirTree('/data/games');
      Module.FS.writeFile(romPath, rom);

      say('booting…');
      const ok = Module.loadGame(romPath);
      if (!ok) throw new Error('loadGame failed');
      const runningMsg = `running on ${version} — HELLO GBC! demo (DMG only, classic $E0 green)`;
      say(runningMsg);

      // Pause is a toggle (P / pill). Pause used to have no resume —
      // pressing it froze the screen until a full page reload.
      let paused = false;
      const pausePill = document.getElementById('btn-pause');
      const togglePause = () => {
        paused = !paused;
        if (paused) {
          Module.pauseGame();
          pausePill.textContent = 'Resume';
          say('paused — press P or tap Resume');
        } else {
          Module.resumeGame();
          pausePill.textContent = 'Pause';
          say(runningMsg);
        }
      };
      // Fresh boot without a page reload: re-runs the ROM from the start
      // (auto save state is disabled, so nothing is restored).
      const resetGame = () => {
        if (paused) togglePause(); // don't reset into a paused frame
        say('resetting — fresh ROM boot…');
        Module.quickReload();
        setTimeout(() => { if (!paused) say(runningMsg); }, 400);
      };

      // Keyboard → buttons
      const keys = {
        KeyZ: 'B', KeyX: 'A', KeyEnter: 'Start', ShiftLeft: 'Select', ShiftRight: 'Select',
        ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
      };
      for (const [code, button] of Object.entries(keys)) {
        addEventListener('keydown', (e) => {
          if (e.code === 'KeyP') { togglePause(); return; }
          if (e.code === 'KeyR') { resetGame(); return; }
          if (keys[e.code] && !e.repeat) Module.buttonPress(keys[e.code]);
        });
        addEventListener('keyup', (e) => {
          if (keys[e.code]) Module.buttonUnpress(keys[e.code]);
        });
      }

      // Touch / on-screen buttons: multi-touch safe (hold d-pad while
      // keying A), pointer capture so a sliding finger can't leave a
      // button stuck, and no long-press context menu.
      for (const btn of document.querySelectorAll('#pad button, #pills button')) {
        const fire = (down) => {
          if (btn.dataset.btn) Module[down ? 'buttonPress' : 'buttonUnpress'](btn.dataset.btn);
          else if (btn.dataset.action === 'pause' && down) togglePause();
          else if (btn.dataset.action === 'reset' && down) resetGame();
        };
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          try { btn.setPointerCapture(e.pointerId); } catch { /* no-op */ }
          btn.classList.add('pressed');
          fire(true);
        });
        const release = (e) => {
          if (!btn.hasPointerCapture(e.pointerId)) return;
          btn.releasePointerCapture(e.pointerId);
          btn.classList.remove('pressed');
          fire(false);
        };
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
      }
      for (const id of ['pad', 'pills']) {
        document.getElementById(id).addEventListener('contextmenu', (e) => e.preventDefault());
      }
    } catch (err) {
      console.error(err);
      say(`error: ${err.message}`, true);
    }
  </script>
</body>
</html>
