# Build the ROM and deploy the static mGBA-wasm site (web/_site/) to the
# git-pages server (https://git-pages.org) in front of this Gitea instance.
#
# The site URL is hardcoded in the env block below (PAGES_SITE).
# Configure in the repo's Actions settings (Settings → Actions):
#   Secret    PAGES_TOKEN  access token of an account the git-pages server can
#                          verify against the forge (authorizes publishing
#                          for the subdomain above). If the secret is unset
#                          the deploy step is skipped and the site is only
#                          built and uploaded as an artifact.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RGBDS_VERSION: "0.9.3"
  PAGES_SITE: "https://opencode-bot.pages.zoltanlabs.ca/"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (RGBDS, Node)
        run: |
          set -e
          if [ "$(uname -m)" = "x86_64" ]; then
            curl -fsSL -o /tmp/rgbds.tar.xz \
              "https://github.com/gbdev/rgbds/releases/download/v${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
            sudo tar -xJf /tmp/rgbds.tar.xz -C /usr/local
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq rgbds
          fi
          rgbasm --version && rgblink --version && rgbfix --version
          if ! command -v node >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nodejs npm
          fi
          node --version && npm --version

      - name: Install JS dependencies (mGBA WASM core)
        run: npm ci

      - name: Build ROM + static site
        run: make site

      - name: Smoke-test ROM (mGBA headless)
        run: make test

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/_site

      - name: Deploy to git-pages
        env:
          GIT_PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          set -e
          if [ -z "$GIT_PAGES_TOKEN" ]; then
            echo "PAGES_TOKEN secret not set — skipping deploy (site is in the artifact)."
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)      arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" && exit 1 ;;
          esac
          curl -fsSL -o /tmp/git-pages-cli \
            "https://codeberg.org/git-pages/git-pages-cli/releases/download/latest/git-pages-cli.linux-${arch}"
          chmod +x /tmp/git-pages-cli
          /tmp/git-pages-cli "$PAGES_SITE" --upload-dir web/_site --strict
